<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>音色库 · TTS Studio</title><link rel="stylesheet" href="assets/tts-studio.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-auth-inject.js"></script><script src="quota-interceptor.js"></script></head>
<body data-page="voices"><script src="assets/tts-shell.js"></script><main class="app-main"><div class="page-shell">
<header class="page-heading"><div class="page-kicker">VOICE LIBRARY</div><h1>精品音色，开箱即用</h1><p>可用音色随模型能力变化。搜索、筛选、试听并复制 Voice ID，点击卡片即可带入文本转语音。</p></header>
<section class="panel">
  <div class="library-toolbar"><div><span class="section-title">全部可用音色</span> <span class="muted" id="library-count"></span></div><input class="search" id="library-search" placeholder="搜索音色 / Voice ID"></div>
  <div class="chips library-filter-chips" id="library-filters">
    <button class="chip on" data-category="all" type="button">全部</button><button class="chip" data-category="kefu" type="button">客服</button><button class="chip" data-category="shuoshu" type="button">说书</button><button class="chip" data-category="zh" type="button">中文</button><button class="chip" data-category="en" type="button">English</button><button class="chip" data-category="ja" type="button">日本語</button><button class="chip" data-category="yue" type="button">粤语</button><button class="chip" data-category="th" type="button">ไทย</button>
  </div>
  <div class="library-grid" id="library-grid"><div class="empty-state">正在加载音色...</div></div><p class="pagination-note">当前接口返回 101 个精选音色；需求中的 327 个 flow_01_ex 扩展音色尚无数据源，已记录至 TODO。</p>
</section>
</div></main><script src="assets/tts-studio.js"></script></body></html>
